<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>arXiv Digest</title>
    <link rel="stylesheet" href="./vendor/katex/katex.min.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div>
        <p class="eyebrow">Your local reading queue</p>
        <p class="brand">arXiv Digest</p>
      </div>
      <button id="quit" type="button">Quit</button>
    </header>
    <nav class="primary-navigation" aria-label="Primary" hidden>
      <button type="button" data-view="review">Review</button>
      <button type="button" data-view="calendar">Calendar</button>
      <button type="button" data-view="library">Library</button>
      <button type="button" data-view="interests">Interests</button>
      <button type="button" data-view="settings">Settings</button>
    </nav>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <main id="content" tabindex="-1"></main>
    <script src="./vendor/katex/katex.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
