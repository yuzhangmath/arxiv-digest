[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-digest"
dynamic = ["version"]
description = "A local, explainable arXiv digest and review queue"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "packaging>=24,<27",
]

[project.urls]
Repository = "https://github.com/yuzhangmath/arxiv-digest"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pipx==1.16.7",
  "playwright>=1.46,<2",
  "pytest>=8,<9",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "arxiv_digest.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arxiv_digest = [
  "assets/*.icns",
  "assets/*.svg",
  "storage/migrations/*.sql",
  "web/static/*",
  "web/static/vendor/katex/*",
  "web/static/vendor/katex/fonts/*",
]

[tool.setuptools.data-files]
"share/arxiv-digest" = ["THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
