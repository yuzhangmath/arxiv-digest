name: tests

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.11", "3.x"]
        suite: [python, browser]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source line endings on every platform
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
      - name: Set up Node.js
        if: matrix.suite == 'python'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Install application and development dependencies
        run: |
          umask 022
          python -m pip install ".[dev]"
      - name: Resolve canonical application version
        shell: bash
        run: |
          set -euo pipefail
          ARXIV_DIGEST_VERSION="$(python -c 'import sys; from arxiv_digest import __version__; sys.stdout.write(__version__)')"
          python scripts/release_check.py --tag "v${ARXIV_DIGEST_VERSION}"
          commit_sha="$(git rev-parse --verify HEAD)"
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          source_date_epoch="$(git show -s --format=%ct "$commit_sha")"
          printf 'ARXIV_DIGEST_VERSION=%s\n' "$ARXIV_DIGEST_VERSION" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
          printf 'ARXIV_DIGEST_RELEASE_ARTIFACT_DIR=%s/dist\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'COMMIT_SHA=%s\n' "$commit_sha" >> "$GITHUB_ENV"
      - name: Build package artifacts
        run: python -m build
      - name: Verify the local release bundle
        shell: bash
        env:
          BUNDLE: ${{ runner.temp }}/release-bundle
        run: |
          set -euo pipefail
          python - <<'PY_BUNDLE'
          import hashlib
          import os
          import shutil
          from pathlib import Path
          root = Path(os.environ["BUNDLE"])
          root.mkdir()
          version = os.environ["ARXIV_DIGEST_VERSION"]
          names = (f"arxiv_digest-{version}-py3-none-any.whl", f"arxiv_digest-{version}.tar.gz")
          lines = []
          for name in names:
              shutil.copyfile(Path("dist") / name, root / name)
              digest = hashlib.sha256()
              with (root / name).open("rb") as source:
                  while chunk := source.read(65536):
                      digest.update(chunk)
              lines.append(f"{digest.hexdigest()}  {name}\n")
          (root / "SHA256SUMS").write_bytes("".join(lines).encode("ascii"))
          shutil.copyfile(Path("docs/releases") / f"v{version}.md", root / "RELEASE_NOTES.md")
          (root / "COMMIT_SHA").write_bytes((os.environ["COMMIT_SHA"] + "\n").encode("ascii"))
          PY_BUNDLE
          python scripts/publish_verifier.py --bundle "$BUNDLE" --version "$ARXIV_DIGEST_VERSION" --commit "$COMMIT_SHA"
      - name: Run Python tests
        if: matrix.suite == 'python'
        run: |
          umask 022
          python -m pytest tests/unit tests/integration -q --junitxml="$RUNNER_TEMP/python-tests.xml" --durations=10
      - name: Summarize Python test failures
        if: failure() && matrix.suite == 'python'
        run: python scripts/ci_test_summary.py "$RUNNER_TEMP/python-tests.xml"
      - name: Run JavaScript tests
        if: matrix.suite == 'python'
        run: node --test tests/js/*.test.mjs
      - name: Install Playwright browsers and Linux dependencies
        if: matrix.suite == 'browser' && runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium webkit
      - name: Install Playwright browsers on macOS and Windows
        if: matrix.suite == 'browser' && runner.os != 'Linux'
        run: python -m playwright install chromium webkit
      - name: Run browser tests
        if: matrix.suite == 'browser'
        run: |
          umask 022
          python -m pytest tests/browser -q --junitxml="$RUNNER_TEMP/browser-tests.xml" --durations=10
      - name: Summarize browser test failures
        if: failure() && matrix.suite == 'browser'
        run: python scripts/ci_test_summary.py "$RUNNER_TEMP/browser-tests.xml"
      - name: Run privacy gates
        if: matrix.suite == 'python'
        shell: bash
        env:
          EXPECTED_REMOTE: ${{ github.server_url }}/${{ github.repository }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          python scripts/privacy_scan.py tree . --expected-remote "$EXPECTED_REMOTE"
          python scripts/privacy_scan.py history . --expected-remote "$EXPECTED_REMOTE"
          python scripts/privacy_scan.py archive "dist/arxiv_digest-${ARXIV_DIGEST_VERSION}.tar.gz"
          python scripts/privacy_scan.py archive "dist/arxiv_digest-${ARXIV_DIGEST_VERSION}-py3-none-any.whl"
      - name: Smoke-test the wheel through pipx
        if: matrix.suite == 'python'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pipx
          umask 022
          python - <<'PY_SMOKE'
          import os
          import subprocess
          import sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "pipx-smoke"
          root.mkdir()
          version = os.environ["ARXIV_DIGEST_VERSION"]
          wheel = Path(os.environ["ARXIV_DIGEST_RELEASE_ARTIFACT_DIR"]) / f"arxiv_digest-{version}-py3-none-any.whl"
          smoke_env = dict(os.environ)
          for key, directory in (
              ("HOME", "home"), ("USERPROFILE", "home"),
              ("XDG_CONFIG_HOME", "config"), ("XDG_DATA_HOME", "data"),
              ("XDG_CACHE_HOME", "cache"), ("XDG_STATE_HOME", "state"),
              ("APPDATA", "appdata"), ("LOCALAPPDATA", "localappdata"),
              ("PIPX_HOME", "pipx-home"), ("PIPX_BIN_DIR", "pipx-bin"),
              ("PIPX_SHARED_LIBS", "pipx-shared"), ("PIPX_MAN_DIR", "pipx-man"),
              ("PIPX_COMPLETION_DIR", "pipx-completion"), ("PIP_CACHE_DIR", "pip-cache"),
          ):
              location = root / directory
              location.mkdir(exist_ok=True)
              smoke_env[key] = str(location)
          smoke_env["PIPX_DEFAULT_PYTHON"] = sys.executable
          unrelated = root / "unrelated"
          unrelated.mkdir(exist_ok=True)
          subprocess.run([sys.executable, "-m", "pipx", "install", str(wheel)], cwd=unrelated, env=smoke_env, check=True)
          state = root / "doctor-state"
          smoke_env.update(ARXIV_DIGEST_TESTING="1", ARXIV_DIGEST_TEST_ROOT=str(state))
          executable = root / "pipx-bin" / ("arxiv-digest.exe" if os.name == "nt" else "arxiv-digest")
          result = subprocess.run([str(executable), "doctor"], cwd=unrelated, env=smoke_env, capture_output=True, text=True, check=True)
          assert result.stdout.splitlines()[0] == f"arXiv Digest {version}"
          for relative in ("config/profile.json", "data/state.sqlite3", "data/runtime.json"):
              assert not (state / relative).exists(), relative
          PY_SMOKE

      - name: Confirm verification did not alter tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
