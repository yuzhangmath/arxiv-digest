name: tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m pytest tests/unit tests/integration -q
      - run: node --test tests/js/*.test.mjs
      - name: Install Playwright browsers and Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium webkit
      - name: Install Playwright browsers on macOS
        if: runner.os == 'macOS'
        run: python -m playwright install chromium webkit
      - run: python -m pytest tests/browser -q
      - run: python -m pytest tests/integration/test_package_contents.py -q
      - run: python scripts/privacy_scan.py tree . --expected-remote "${{ github.server_url }}/${{ github.repository }}"
      - run: python scripts/privacy_scan.py archive dist/arxiv_digest-0.2.0.tar.gz
      - run: python scripts/privacy_scan.py archive dist/arxiv_digest-0.2.0-py3-none-any.whl
      - name: Smoke-test the wheel through pipx
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/pipx-bin" "${{ runner.temp }}/unrelated"
          cd "${{ runner.temp }}/unrelated"
          PIPX_HOME="${{ runner.temp }}/pipx-home" PIPX_BIN_DIR="${{ runner.temp }}/pipx-bin" python -m pipx install "${{ github.workspace }}/dist/arxiv_digest-0.2.0-py3-none-any.whl"
          ARXIV_DIGEST_TESTING=1 ARXIV_DIGEST_TEST_ROOT="${{ runner.temp }}/doctor-state" "${{ runner.temp }}/pipx-bin/arxiv-digest" doctor
          test ! -e "${{ runner.temp }}/doctor-state"
